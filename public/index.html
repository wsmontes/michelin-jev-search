<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michelin mundial com Jev</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e7e9ee;
    --dim: #9aa3b2;
    --accent: #6ea8fe;
    --good: #4ec9a0;
    --mid: #e0b341;
    --bad: #e06c6c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 13px 20px 11px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 20px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .meta { color: var(--dim); font-size: 12.5px; }
  header .meta b { color: var(--text); font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 460px;
    flex: 0 0 460px;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #map { flex: 1; min-height: 0; background: #0b0d11; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px; }
  textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0; }
  .examples button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .examples button:hover { color: var(--text); border-color: var(--accent); }
  .settings { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 10px; font-size: 12.5px; color: var(--dim); }
  .settings label { display: flex; align-items: center; gap: 7px; }
  .settings output { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 7px; font: inherit; font-size: 12.5px;
  }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  .row-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button.primary {
    background: var(--accent); color: #0b1220; border: 0; border-radius: 7px;
    padding: 9px 16px; font: inherit; font-weight: 650; cursor: pointer;
  }
  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 7px; padding: 8px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  button.ghost:hover { color: var(--text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: progress; }
  .status { margin-top: 9px; color: var(--dim); font-size: 12.5px; min-height: 17px; }
  .status.error { color: var(--bad); }

  .rounds { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .round {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 9px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 12.5px;
  }
  .round .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  .round b { font-weight: 650; }
  .round .sub { color: var(--dim); }
  .round .gain { color: var(--good); }
  .round .flat { color: var(--dim); }
  .coverage { font-size: 12.5px; color: var(--dim); margin-top: 9px; }
  .coverage b { color: var(--text); font-weight: 650; }

  .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .result {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; cursor: pointer;
  }
  .result:hover { border-color: var(--accent); }
  .result .top { display: flex; align-items: baseline; gap: 8px; }
  .result .rank { color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 650; width: 17px; }
  .result .name { font-weight: 600; flex: 1; }
  .result .score { font-variant-numeric: tabular-nums; font-weight: 650; }
  .result .bar { height: 5px; background: #10131a; border-radius: 3px; margin: 5px 0; overflow: hidden; }
  .result .bar > span { display: block; height: 100%; }
  .result .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11.5px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  .recall { border-color: rgba(224, 179, 65, .4); background: rgba(224, 179, 65, .06); font-size: 13px; }
  .recall b { font-weight: 650; }
  .recall .missed { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .leaflet-container { background: #0b0d11; }
  .leaflet-control-attribution { background: rgba(15, 17, 21, .8); color: var(--dim); }
  .leaflet-control-attribution a { color: var(--dim); }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    aside { width: auto; flex: 0 0 auto; border-right: 0; border-bottom: 1px solid var(--line); }
    #map { min-height: 420px; }
  }
</style>
</head>
<body>
<header>
  <h1>Michelin mundial com Jev</h1>
  <span class="meta" id="cabecalho">carregando catálogo…</span>
</header>
<main>
  <aside>
    <section class="panel">
      <textarea id="pedido" rows="3" placeholder="Ex.: japonês tranquilo para jantar a dois, sem gastar muito."></textarea>
      <div class="examples" id="exemplos"></div>
      <div class="settings">
        <label>rodadas
          <select id="rodadas">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="6">6</option>
          </select>
        </label>
        <label>desconto por confiança
          <input type="range" id="peso" min="0" max="100" step="5" value="30">
          <output id="peso-out">30%</output>
        </label>
        <span style="flex-basis:100%">0% = nota pura · 100% = nota × confiança. A confiança só <b>derruba</b> a nota: nunca promove — medido, o Jev fica mais "confiante" nos restaurantes que ele descarta com certeza.</span>
      </div>
      <div class="row-buttons">
        <button class="primary" id="buscar">Buscar por rodadas</button>
        <button class="ghost" id="selecionar">Selecionar área no mapa</button>
        <button class="ghost" id="limpar" hidden>Limpar área</button>
      </div>
      <div class="status" id="status"></div>
      <ol class="rounds" id="rodadas-lista"></ol>
      <div class="coverage" id="cobertura"></div>
    </section>

    <section class="panel" id="painelResultados" hidden>
      <ol class="results" id="resultados"></ol>
      <div class="row-buttons" style="margin-top:11px">
        <button class="ghost" id="conferir">Conferir tudo (28 chamadas · ~$0,067)</button>
      </div>
    </section>

    <section class="panel recall" id="recall" hidden></section>
  </aside>
  <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const EXAMPLES = [
  'Japonês tranquilo para jantar a dois, sem gastar muito.',
  'Francês clássico com carta de vinhos boa, em Paris.',
  'Algo de três estrelas em qualquer lugar do mundo, preço não importa.',
  'Onde comer boa comida tailandesa em Bangkok?',
];

const $ = id => document.getElementById(id);
const number = (value, digits = 0) => value.toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
const scoreColor = score => (score >= 4 ? 'var(--good)' : score >= 2.5 ? 'var(--mid)' : 'var(--bad)');
const mapScoreColor = score => (score >= 4 ? '#4ec9a0' : score >= 3 ? '#9ed36a' : score >= 2 ? '#e0b341' : '#e06c6c');
const roundColor = round => ['#3f6ea8', '#4f8fd0', '#6ea8fe', '#9ec5ff'][Math.min(round - 1, 3)];

let catalog = { total: 0, points: [] };
let markers = new Map();
let last = null;
let box = null;
let selecting = false;
let dragStart = null;
let rectangle = null;

// ── mapa ─────────────────────────────────────────────────────────────────────
// `map` como nome de variável colide com o window.map que o navegador cria a
// partir do id="map" — na página, `map` virava o <div>, não o mapa do Leaflet.
const worldMap = L.map('map', { worldCopyJump: true, minZoom: 2, maxZoom: 16, preferCanvas: true })
  .setView([25, 5], 2);
window.worldMap = worldMap;
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16,
  attribution: '© Esri · © OpenStreetMap',
}).addTo(worldMap);
const dotLayer = L.layerGroup().addTo(worldMap);
const resultLayer = L.layerGroup().addTo(worldMap);

worldMap.on('mousedown', event => {
  if (!selecting) return;
  dragStart = event.latlng;
  worldMap.dragging.disable();
});
worldMap.on('mousemove', event => {
  if (!selecting || !dragStart) return;
  const bounds = L.latLngBounds(dragStart, event.latlng);
  if (rectangle) rectangle.setBounds(bounds);
  else rectangle = L.rectangle(bounds, { color: '#6ea8fe', weight: 1, dashArray: '4', fillOpacity: 0.07, interactive: false }).addTo(worldMap);
});
worldMap.on('mouseup', event => {
  if (!selecting || !dragStart) return;
  worldMap.dragging.enable();
  const bounds = L.latLngBounds(dragStart, event.latlng);
  dragStart = null;
  selecting = false;
  $('selecionar').textContent = 'Selecionar área no mapa';
  if (Math.abs(bounds.getNorth() - bounds.getSouth()) < 0.2) return;
  box = { north: bounds.getNorth(), south: bounds.getSouth(), east: bounds.getEast(), west: bounds.getWest() };
  $('limpar').hidden = false;
  $('cobertura').innerHTML = `área no mapa: <b>${box.south.toFixed(1)}…${box.north.toFixed(1)}</b> de latitude, <b>${box.west.toFixed(1)}…${box.east.toFixed(1)}</b> de longitude — a próxima busca amostra só daqui`;
  if (last) runSearch();
});

$('limpar').addEventListener('click', () => {
  box = null;
  if (rectangle) { worldMap.removeLayer(rectangle); rectangle = null; }
  $('limpar').hidden = true;
  $('cobertura').textContent = '';
  if (last) runSearch();
});
$('selecionar').addEventListener('click', () => {
  selecting = !selecting;
  $('selecionar').textContent = selecting ? 'Arraste sobre o mapa…' : 'Selecionar área no mapa';
  if (selecting) worldMap.dragging.disable(); else worldMap.dragging.enable();
  worldMap.getContainer().style.cursor = selecting ? 'crosshair' : '';
});

$('peso').addEventListener('input', () => { $('peso-out').textContent = `${$('peso').value}%`; });

// ── catálogo ─────────────────────────────────────────────────────────────────
fetch('/api/catalog').then(response => response.json()).then(data => {
  catalog = data;
  $('cabecalho').innerHTML =
    `<b>${number(data.total)}</b> restaurantes no mapa · rodadas de <b>${data.roundSize}</b> · ` +
    `os <b>${data.keepBest}</b> melhores guiam a rodada seguinte`;
  const renderer = L.canvas({ padding: 0.5 });
  for (const point of data.points) {
    const marker = L.circleMarker([point.lat, point.lon], {
      renderer, radius: baseRadius, color: '#8b95a8', weight: 1, fillColor: '#8b95a8', fillOpacity: 0.7,
    });
    marker.on('click', () => showPopup(point));
    marker.addTo(dotLayer);
    markers.set(point.id, marker);
  }
  $('status').textContent = `${number(data.total)} pontos desenhados. Escreva um pedido.`;
}).catch(error => {
  $('status').className = 'status error';
  $('status').textContent = `Catálogo falhou: ${error.message}`;
});

$('exemplos').innerHTML = EXAMPLES.map(text => `<button type="button">${text}</button>`).join('');
for (const button of $('exemplos').querySelectorAll('button')) {
  button.addEventListener('click', () => { $('pedido').value = button.textContent; $('pedido').focus(); });
}

function showPopup(point, score, round) {
  const extra = score === undefined ? ''
    : `<br>nota do Jev: <b>${score.toFixed(2)}</b>${round ? ` · achado na rodada ${round}` : ''}`;
  L.popup({ closeButton: false })
    .setLatLng([point.lat, point.lon])
    .setContent(`<b>${point.name}</b><br>${point.cuisine} · ${point.city}<br>${point.award}${extra}`)
    .openOn(worldMap);
}

// ── desenho ──────────────────────────────────────────────────────────────────
// O raio acompanha o zoom: 6.802 pontos no mundo viram borrão se forem grandes,
// e somem se forem pequenos demais ao aproximar.
let baseRadius = 2;
const radiusForZoom = () =>
  worldMap.getZoom() <= 3 ? 1.8 : worldMap.getZoom() <= 5 ? 2.6 : 4.2;

const paint = (marker, overrides = {}) =>
  marker.setStyle({
    radius: baseRadius, color: '#8b95a8', fillColor: '#8b95a8', fillOpacity: 0.7, weight: 1,
    ...overrides,
  });

worldMap.on('zoomend', () => {
  const radius = radiusForZoom();
  if (radius === baseRadius) return;
  baseRadius = radius;
  for (const marker of markers.values()) paint(marker);
  if (last) highlight(last);
});

function highlight(data) {
  baseRadius = radiusForZoom();
  for (const marker of markers.values()) paint(marker);

  for (const row of data.results) {
    const marker = markers.get(row.id);
    if (!marker) continue;
    paint(marker, {
      radius: baseRadius + 1.4,
      color: roundColor(row.round),
      fillColor: roundColor(row.round),
      fillOpacity: 0.95,
    });
  }

  resultLayer.clearLayers();
  const renderer = L.canvas({ padding: 0.5 });
  for (const [index, row] of data.results.slice(0, 20).entries()) {
    L.circleMarker([row.lat, row.lon], {
      renderer,
      radius: index < 3 ? 7 : 5,
      color: '#0f1115', weight: 1.5,
      fillColor: mapScoreColor(row.score), fillOpacity: 0.95,
    }).on('click', () => showPopup(row, row.score, row.round)).addTo(resultLayer);
  }
}

function renderRounds(data) {
  $('rodadas-lista').innerHTML = data.rounds.map(round => `
    <li class="round" style="border-left-color:${roundColor(round.index)}">
      <span class="num">rodada ${round.index}</span>
      <span>
        <b>${round.judged}</b> julgados · ${round.strategy}<br>
        nota média <b>${round.meanScore.toFixed(2)}</b> · confiança média ${round.meanConfidence.toFixed(2)}<br>
        melhor: <b>${round.bestName ?? '—'}</b> ${round.bestScore ?? ''}
        ${round.bestCity ? `<span class="sub">(${round.bestCity})</span>` : ''} ·
        <span class="${round.newInTop > 0 ? 'gain' : 'flat'}">${round.newInTop} novo${round.newInTop === 1 ? '' : 's'} no top-20</span>
        <span class="sub">· ${round.ms.toFixed(0)} ms · $${round.costUsd.toFixed(5)}</span>
      </span>
    </li>`).join('');

  const share = (data.judged / data.catalogueSize) * 100;
  $('cobertura').innerHTML =
    `julgados <b>${number(data.judged)}</b> de ${number(data.catalogueSize)} ` +
    `(<b>${share.toFixed(1)}%</b>)${data.box ? `, amostrando de ${number(data.poolSize)} na área` : ''} · ` +
    `parou por <b>${data.stopped}</b> · <b>${data.meta.calls}</b> chamada(s) · ` +
    `${(data.meta.latencyMs / 1000).toFixed(1)} s · <b>$${data.meta.costUsd.toFixed(5)}</b>`;
}

function renderResults(data) {
  last = data;
  renderRounds(data);
  $('painelResultados').hidden = false;

  // A posição vem do critério combinado (nota + confiança), então mostrar só a
  // nota bruta faz a lista parecer fora de ordem.
  const weight = data.confidenceWeight ?? 0;
  const adjusted = row => row.score * (1 - weight * (1 - (row.confidence ?? 0)));

  $('resultados').innerHTML = data.results.slice(0, 20).map((row, index) => `
    <li class="result" data-id="${row.id}">
      <div class="top">
        <span class="rank">${index + 1}</span>
        <span class="name">${row.name}</span>
        <span class="score" style="color:${scoreColor(row.score)}">${row.score.toFixed(2)}</span>
      </div>
      <div class="bar"><span style="width:${(adjusted(row) / 5) * 100}%;background:${scoreColor(row.score)}"></span></div>
      <div class="tags">
        <span class="tag">${row.cuisine.slice(0, 30)}</span>
        <span class="tag">${row.city}</span>
        <span class="tag">${row.award.replace(' MICHELIN', '')}</span>
        <span class="tag">conf ${row.confidence === null ? '—' : row.confidence.toFixed(2)}</span>
        ${weight > 0 ? `<span class="tag" style="border-color:var(--accent)">ajustada ${adjusted(row).toFixed(2)}</span>` : ''}
        <span class="tag" style="border-color:${roundColor(row.round)}">rodada ${row.round}</span>
      </div>
    </li>`).join('');

  for (const element of $('resultados').querySelectorAll('.result')) {
    const row = data.results.find(entry => entry.id === element.dataset.id);
    element.addEventListener('click', () => {
      worldMap.setView([row.lat, row.lon], 12);
      showPopup(row, row.score, row.round);
    });
  }

  highlight(data);
  $('status').className = 'status';
  $('status').innerHTML = `busca concluída: <b>${data.stopped}</b>`;
}

// ── chamadas ─────────────────────────────────────────────────────────────────
async function runSearch() {
  const request = $('pedido').value.trim();
  const button = $('buscar');
  if (request.length < 3) {
    $('status').className = 'status error';
    $('status').textContent = 'Escreva um pedido primeiro.';
    return;
  }
  const rounds = Number($('rodadas').value);
  const confidenceWeight = Number($('peso').value) / 100;
  button.disabled = true;
  $('painelResultados').hidden = true;
  $('recall').hidden = true;
  $('rodadas-lista').innerHTML = '';
  $('status').className = 'status';
  const started = performance.now();
  const ticker = setInterval(() => {
    $('status').textContent = `rodadas de 250 candidatos no Jev… ${((performance.now() - started) / 1000).toFixed(1)} s`;
  }, 200);
  try {
    const response = await fetch('/api/search', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ request, box, rounds, confidenceWeight }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    renderResults(data);
  } catch (error) {
    $('status').className = 'status error';
    $('status').textContent = `Falhou: ${error.message}`;
  } finally {
    clearInterval(ticker);
    button.disabled = false;
  }
}

$('buscar').addEventListener('click', runSearch);

$('conferir').addEventListener('click', async () => {
  if (!last) return;
  const button = $('conferir');
  button.disabled = true;
  $('status').className = 'status';
  const started = performance.now();
  const ticker = setInterval(() => {
    $('status').textContent = `conferindo os ${number(catalog.total)} restaurantes em lotes de 250… ${((performance.now() - started) / 1000).toFixed(1)} s`;
  }, 200);
  try {
    const response = await fetch('/api/exhaustive', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ request: last.request, judgedIds: last.judgedIds }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    const recall = data.recall;
    $('recall').hidden = false;
    $('recall').innerHTML = `
      <b>Conferência exaustiva</b> — ${number(catalog.total)} restaurantes em ${data.meta.calls} chamadas,
      ${(data.meta.latencyMs / 1000).toFixed(1)} s, $${data.meta.costUsd.toFixed(4)}.<br>
      Dos <b>${recall.topN}</b> melhores no exaustivo, <b>${recall.hits}</b> estavam entre os
      ${number(recall.judgedSize)} julgados pelas rodadas (acerto ${Math.round((recall.hits / recall.topN) * 100)}%).
      Melhor julgado na ordem exaustiva: <b>${recall.bestJudgedPosition}º</b>.
      ${recall.missed.length ? `<div class="missed">Passaram longe das rodadas: ${recall.missed.map(m => `${m.name} (${m.city}, ${m.score.toFixed(2)})`).join(' · ')}</div>` : ''}
      <ol class="results" style="margin-top:10px">
        ${data.top.slice(0, 10).map((row, index) => `
          <li class="result" data-lat="${row.lat}" data-lon="${row.lon}">
            <div class="top">
              <span class="rank">${index + 1}</span>
              <span class="name">${row.name}</span>
              <span class="score" style="color:${scoreColor(row.score)}">${row.score.toFixed(2)}</span>
            </div>
            <div class="tags"><span class="tag">${row.city}</span><span class="tag">${row.award.replace(' MICHELIN', '')}</span></div>
          </li>`).join('')}
      </ol>`;
    for (const element of $('recall').querySelectorAll('.result')) {
      element.addEventListener('click', () => worldMap.setView([+element.dataset.lat, +element.dataset.lon], 12));
    }
    for (const row of data.top.slice(0, 20)) {
      L.circleMarker([row.lat, row.lon], {
        renderer: L.canvas({ padding: 0.5 }), radius: 8, color: '#f0c674', weight: 1.5, fillOpacity: 0,
      }).addTo(resultLayer);
    }
    $('status').className = 'status';
    $('status').innerHTML = `conferência concluída · acerto das rodadas no top-20 exaustivo: <b>${Math.round((recall.hits / recall.topN) * 100)}%</b>`;
  } catch (error) {
    $('status').className = 'status error';
    $('status').textContent = `Conferência falhou: ${error.message}`;
  } finally {
    clearInterval(ticker);
    button.disabled = false;
  }
});
</script>
</body>
</html>
